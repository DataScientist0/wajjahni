<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Places — Wajjahni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">Wajjahni<span>.</span></div>
    <nav class="nav-links" id="navLinks">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="places.html" data-i18n="nav.places">Places</a>
      <a href="map.html" data-i18n="nav.map">Map</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="nav-right">
      <div class="nav-meta" id="resultCount">56 places</div>
      <button id="langToggle" class="lang-toggle">العربية</button>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
      <button id="navToggle" class="nav-toggle" aria-label="Open menu">☰</button>
    </div>
  </div>
</header>

<section class="page-head">
  <h1 class="display" data-i18n="page.places.title">All places</h1>
  <p class="lede" data-i18n="page.places.lede">Search, filter, or sort by distance from you.</p>
</section>

<div class="controls">
  <div class="search-row">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search a place, e.g. Hegra, Farasan..." data-i18n-placeholder="search.placeholder">
    </div>
    <button id="locateBtn" class="locate-btn" data-i18n="locate.btn">📍 Distance from me</button>
  </div>
  <div id="locateStatus" class="locate-status"></div>
  <div class="chip-row" id="typeChips"></div>
  <div class="chip-row regions" id="regionChips"></div>
</div>

<div class="places-grid" id="placesGrid"></div>

<footer data-i18n="footer.text">Wajjahni — a student portfolio project. Place data is illustrative, not an official tourism source. © 2026 Najla. All rights reserved.</footer>

<div id="peakModal" class="peak-modal">
  <div class="peak-modal-box">
    <button id="peakClose" class="peak-close" aria-label="Close">✕</button>
    <h3 class="peak-title" id="peakModalTitle">Place name</h3>
    <p class="peak-sub" id="peakModalSub"></p>
    <div class="peak-chart" id="peakBars"></div>
    <p class="peak-verdict" id="peakVerdict"></p>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
let activeRegion = 'All';
let activeType = 'All';
let searchTerm = '';

function buildChips(container, values, isRegion) {
  container.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip active';
  allChip.dataset.value = 'All';
  allChip.textContent = t('chip.all');
  allChip.onclick = () => {
    if (isRegion) { activeRegion = 'All'; } else { activeType = 'All'; }
    refreshChipState(container);
    render();
  };
  container.appendChild(allChip);
  values.forEach(v => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.dataset.value = v;
    chip.textContent = isRegion ? tRegion(v) : tType(v);
    chip.onclick = () => {
      if (isRegion) { activeRegion = v; } else { activeType = v; }
      refreshChipState(container);
      render();
    };
    container.appendChild(chip);
  });
}
function refreshChipState(container) {
  const current = container === document.getElementById('regionChips') ? activeRegion : activeType;
  [...container.children].forEach(c => c.classList.toggle('active', c.dataset.value === current));
}

function rebuildChips() {
  buildChips(document.getElementById('typeChips'), types, false);
  buildChips(document.getElementById('regionChips'), regions, true);
  refreshChipState(document.getElementById('typeChips'));
  refreshChipState(document.getElementById('regionChips'));
}
rebuildChips();

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

function filteredIndexes() {
  let idxs = DATA.map((d, i) => i).filter(i => {
    const d = DATA[i];
    if (activeRegion !== 'All' && d.region !== activeRegion) return false;
    if (activeType !== 'All' && d.type !== activeType) return false;
    if (searchTerm && ![d.place_name, d.place_name_ar, d.region, tRegion(d.region), d.city, d.city_ar].some(v => (v || '').toLowerCase().includes(searchTerm))) return false;
    return true;
  });
  if (userLocation) idxs = idxs.sort((a, b) => distanceTo(DATA[a]) - distanceTo(DATA[b]));
  return idxs;
}

function render() {
  const idxs = filteredIndexes();
  const grid = document.getElementById('placesGrid');
  grid.innerHTML = '';

  if (idxs.length === 0) {
    grid.innerHTML = `<div class="empty-state">${t('empty')}</div>`;
  } else {
    idxs.forEach(i => {
      const d = DATA[i];
      const dist = distanceTo(d);
      const distLine = dist != null ? `<span class="pc-distance"> · ${dist.toFixed(0)} ${t('km.away')}</span>` : '';
      const card = document.createElement('div');
      card.className = 'place-tile';
      card.innerHTML = `
        ${placeImage(d, "pt-thumb")}
        <div class="pt-body">
          <div class="pc-top">
            <span class="pc-name"><span class="type-dot" style="background:${TYPE_COLORS[d.type]}"></span>${tName(d)}</span>
            <span class="pc-rating">★ ${d.rating}</span>
          </div>
          <div class="pc-meta">${tLocation(d)} · ${tType(d.type)} · ${t('best.in')} ${tSeason(d.best_season)}${distLine}</div>
          <p class="pt-desc">${tDesc(d)}</p>
          ${photoCredit(d)}
          <div class="card-actions">
            <button class="peak-btn" data-idx="${i}">${t('peak.btn')}</button>
            <a href="${googleMapsUrl(d)}" target="_blank" rel="noopener" class="gmaps-btn">${t('directions.btn')}</a>
          </div>
        </div>
      `;
      card.querySelector('.peak-btn').onclick = () => openPeakModal(i);
      grid.appendChild(card);
    });
  }
  document.getElementById('resultCount').textContent = idxs.length + ' ' + (currentLang === 'ar' ? 'من' : 'of') + ' ' + DATA.length + ' ' + (currentLang === 'ar' ? 'مكان' : 'places');
}

initLocateButton(render);
document.addEventListener('langchange', () => { rebuildChips(); render(); });
render();
</script>
</body>
</html>
